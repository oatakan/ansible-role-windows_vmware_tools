---

# This is needed on 2008
# See: https://kb.vmware.com/s/article/78708
- name: security update 2008
  ansible.builtin.include_tasks: security_update_2008.yml
  when: "'Windows Server 2008' in ansible_distribution or 'Windows 7' in ansible_distribution"

- name: find latest version
  ansible.builtin.include_tasks: find_latest.yml
  when: vmware_tools_find_latest

- name: install vmware tools
  ansible.builtin.include_tasks: install.yml

# This is needed on 2008 for vmware customization to be successful
# See: https://kb.vmware.com/s/article/66765
- name: install the visual C libraries
  ansible.builtin.include_tasks: visual_c.yml
  when:
    - "'Windows Server 2008' in ansible_distribution or 'Windows 7' in ansible_distribution"

- name: reboot after installation
  block:
    - name: reboot after installation (shutdown fallback)
      ansible.windows.win_shell: shutdown.exe /r /t 5 /c "Reboot required by VMware Tools install" /f
      changed_when: true

    - name: wait for host to come back
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 900
  when:
    - (ansible_distribution_version | default('')) is search('^6\\.1')
    - vmware_tools_reboot_required | default(true)

- name: reboot after installation
  block:
    - name: reboot after installation (win_reboot)
      ansible.windows.win_reboot:
  rescue:
    - name: reboot after installation (shutdown fallback)
      ansible.windows.win_shell: shutdown.exe /r /t 5 /c "Reboot required by VMware Tools install" /f
      changed_when: true

    - name: wait for host to come back
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 900
  when:
    - vmware_tools_reboot_required | default(true)
    - not ((ansible_distribution_version | default('')) is search('^6\\.1'))
