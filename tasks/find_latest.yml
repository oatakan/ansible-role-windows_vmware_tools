---

- name: get vmware tools latest download page
  ansible.windows.win_uri:
    url: "{{ vmware_tools_download_base_url }}"
    return_content: true
    validate_certs: "{{ vmware_tools_validate_certs | default(true) }}"
  register: vmware_tools_latest_page
  until: vmware_tools_latest_page is success
  delay: 5
  retries: 30

- name: extract vmware tools installer links
  ansible.builtin.set_fact:
    vmware_tools_latest_install_files: >-
      {{
        vmware_tools_latest_page.content
        | regex_findall('href=\"(VMware-tools-[^\"]+?\\.exe)\"', ignorecase=True)
      }}

- name: select vmware tools latest installer
  ansible.builtin.set_fact:
    vmware_tools_latest_install_file: "{{ vmware_tools_latest_install_files[0] | default('') }}"

- name: set vmware_tools_download_url
  ansible.builtin.set_fact:
    vmware_tools_download_url: "{{ vmware_tools_download_base_url }}{{ vmware_tools_latest_install_file }}"
    vmware_tools_product_id: ''
  when: vmware_tools_latest_install_file | length
