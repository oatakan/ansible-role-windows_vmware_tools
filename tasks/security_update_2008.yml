---

- name: ensure temp directory exists
  ansible.windows.win_file:
    path: '{{ temp_directory }}'
    state: directory

- name: check for built-in DISM
  ansible.windows.win_stat:
    path: C:\Windows\System32\dism.exe
  register: win_dism

- block:
    - name: ensure Windows ADK with DISM is installed
      ansible.windows.win_package:
        path: '{{ windows_adk_download_url }}'
        product_id: '{{ _product_id }}'
        expected_return_code:
          - 0
          - 3010
        arguments: "{{ _arguments | join(' ') }}"
      notify:
        - get Windows ADK uninstall command
        - uninstall Windows ADK

  rescue:
    - block:
        - name: download ADK installer
          ansible.windows.win_get_url:
            url: '{{ windows_adk_download_url }}'
            dest: '{{ temp_directory }}\\adksetup.exe'
            validate_certs: false
          register: download_dism
          retries: 5
          delay: 5
          until: download_dism is success

        - name: ensure Windows ADK with DISM is installed
          ansible.windows.win_package:
            path: '{{ temp_directory }}\\adksetup.exe'
            product_id: '{{ _product_id }}'
            expected_return_code:
              - 0
              - 3010
            arguments: "{{ _arguments | join(' ') }}"
          notify:
            - get Windows ADK uninstall command
            - uninstall Windows ADK

      rescue:
        - name: ensure Windows ADK with DISM is installed (chocolatey)
          chocolatey.chocolatey.win_chocolatey:
            name: windows-adk-deploy
            state: present
            version: '{{ windows_adk_choco_version }}'
          register: install_windows_adk_deploy
          notify: ensure Windows ADK with DISM is removed

  when:
    - windows_vmware_tools_install_adk | default(false)
    - not (win_dism.stat.exists | default(false))

  vars:
    _product_id: '{d794748d-72e9-45d7-9ab7-83d6c4c80f7f}'
    _arguments:
      - /quiet
      - /norestart
      - /features {{ _features | join(' ') }}
    _features:
      - OptionId.DeploymentTools
      - OptionId.WindowsPreinstallationEnvironment
      - OptionId.ImagingAndConfigurationDesigner
      - OptionId.UserStateMigrationTool

- block:
    - name: download hotfix
      ansible.windows.win_get_url:
        url: '{{ win_61_security_hot_fix.url }}'
        dest: '{{ temp_directory }}\{{ win_61_security_hot_fix.file }}'
      register: download_hotfix
      until: download_hotfix is success
      delay: 3
      retries: 5

    - name: check whether DISM PowerShell module is available
      ansible.windows.win_shell: |
        if (Get-Module -ListAvailable -Name Dism -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }
      register: dism_ps_module_check
      changed_when: false
      failed_when: false
      when: ansible_powershell_version is version('4', '>=')

    - name: apply hotfix (ps3)
      ansible.builtin.include_tasks: hotfix_ps3.yml
      when:
        - ansible_powershell_version is version('3', '==')
          or (ansible_powershell_version is version('4', '>=') and (dism_ps_module_check.rc | default(1)) != 0)
      vars:
        hotfix_download: "{{ win_61_security_hot_fix }}"
        hotfix_temp_directory: "{{ temp_directory }}"

    - name: apply hotfix (ps4)
      block:
        - name: apply hotfix (ps4)
          ansible.builtin.include_tasks: hotfix_ps4.yml
          vars:
            hotfix_download: "{{ win_61_security_hot_fix }}"
            hotfix_temp_directory: "{{ temp_directory }}"
      rescue:
        - name: apply hotfix (ps3)
          ansible.builtin.include_tasks: hotfix_ps3.yml
          vars:
            hotfix_download: "{{ win_61_security_hot_fix }}"
            hotfix_temp_directory: "{{ temp_directory }}"
      when:
        - ansible_powershell_version is version('4', '>=')
        - (dism_ps_module_check.rc | default(1)) == 0

    - name: reboot
      block:
        - name: reboot (shutdown fallback)
          ansible.windows.win_shell: shutdown.exe /r /t 5 /c "Reboot required by KB install" /f
          changed_when: true

        - name: wait for host to come back
          ansible.builtin.wait_for_connection:
            delay: 10
            timeout: 900
      when:
        - (ansible_distribution_version | default('')) is search('^6\\.1')
        - hotfix_install is defined
        - hotfix_install is changed

    - name: reboot
      block:
        - name: reboot (win_reboot)
          ansible.windows.win_reboot:
      rescue:
        - name: reboot (shutdown fallback)
          ansible.windows.win_shell: shutdown.exe /r /t 5 /c "Reboot required by KB install" /f
          changed_when: true

        - name: wait for host to come back
          ansible.builtin.wait_for_connection:
            delay: 10
            timeout: 900
      when:
        - not ((ansible_distribution_version | default('')) is search('^6\\.1'))
        - hotfix_install is defined
        - hotfix_install is changed
  always:
    - name: ensure hotfix file is removed
      ansible.windows.win_file:
        path: '{{ temp_directory }}\{{ win_61_security_hot_fix.file }}'
        state: absent
